[project]
name = "ml-proj"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.44.7",
    "certifi>=2026.10.23",
    "dagshub>=0.7.3",
    "evidently>=0.7.23",
    "fastapi>=0.162.7",
    "graphene>=3.4,<4",
    "httpx>=0.28.1",
    "loguru>=0.8.0",
    "mlflow>=3.18.0",
    "numpy>=2.5.4",
    "pandas>=2.3,<3",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pymongo[srv]>=4.20.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
    # CPU build on Linux: the default wheel drags in ~300 MB of NVIDIA NCCL libs
    "xgboost-cpu>=3.4.1; sys_platform == 'linux'",
    "xgboost>=3.4.1; sys_platform != 'linux'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.uv]
# A plain `uv sync` still installs everything; Docker passes --no-default-groups.
default-groups = ["dev", "frontend"]

[dependency-groups]
# Streamlit UI only (see frontend/Dockerfile)
frontend = [
    "httpx>=0.28.1",
    "pandas>=2.3,<3",
    "pyyaml>=6.0.3",
    "streamlit>=1.67.0",
]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "moto[s3]>=5.2.6",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: API tests using a tiny real model and a fake MongoDB (no network)"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]  # pycodestyle, pyflakes, whitespace, import order

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"app/api/schemas.py" = ["E501"]  # long example payload
